<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <title>Happy Birthday, Rose</title>

  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>

  <link href="https://fonts.googleapis.com/css2?family=Bodoni+Moda:opsz,wght@6..96,400;6..96,500;6..96,600;6..96,700;6..96,900&family=DM+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>

    :root {
      --cream: #f7f0e6;
      --cream-light: #fffaf3;
      --red: #c8102e;
      --bright-red: #ed1639;
      --deep-red: #700718;
      --wine: #4c0612;
      --black-red: #250208;
      --text: #241519;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      min-height: 100vh;
      background: var(--cream);
      color: var(--text);
      font-family: "DM Sans", sans-serif;
      overflow-x: hidden;
    }

    /* =========================
       PAGE FRAME
    ========================= */

    .page {
      width: calc(100% - 28px);
      min-height: calc(100vh - 28px);
      margin: 14px auto;

      background: var(--cream-light);

      border: 2px solid var(--wine);

      position: relative;
      overflow: hidden;
    }


    /* =========================
       TOP NAV
    ========================= */

    .top {
      height: 72px;

      padding: 0 32px;

      border-bottom: 2px solid var(--wine);

      display: flex;
      align-items: center;
      justify-content: space-between;

      text-transform: uppercase;
      letter-spacing: .18em;

      font-size: 10px;
      font-weight: 700;

      color: var(--wine);
    }

    .top .right-text {
      color: var(--red);
    }


    /* =========================
       MAIN
    ========================= */

    .hero {
      min-height: 690px;

      position: relative;

      padding: 65px 7vw 80px;

      display: flex;
      flex-direction: column;
      justify-content: center;

      isolation: isolate;
    }


    /* =========================
       GIANT BACKGROUND NUMBER
    ========================= */

    .number {
      position: absolute;

      right: -35px;
      top: -70px;

      font-family: "Bodoni Moda", serif;

      font-size: clamp(230px, 32vw, 490px);

      font-weight: 900;

      line-height: .8;

      color: rgba(200, 16, 46, .055);

      z-index: -1;

      user-select: none;
    }


    /* =========================
       SMALL LABEL
    ========================= */

    .label {
      display: inline-flex;
      align-items: center;
      gap: 12px;

      width: fit-content;

      color: var(--red);

      font-size: 11px;
      font-weight: 700;

      text-transform: uppercase;
      letter-spacing: .25em;

      margin-bottom: 28px;
    }

    .label::before {
      content: "";

      width: 38px;
      height: 2px;

      background: var(--red);
    }


    /* =========================
       MAIN TITLE
    ========================= */

    h1 {
      font-family: "Bodoni Moda", serif;

      font-size: clamp(70px, 11vw, 170px);

      line-height: .76;

      font-weight: 700;

      letter-spacing: -.075em;

      color: var(--wine);

      max-width: 900px;
    }

    h1 .happy {
      display: block;
    }

    h1 .birthday {
      display: block;

      color: var(--red);

      font-style: italic;

      margin-left: 8vw;

      margin-top: 8px;

      position: relative;
    }


    /* =========================
       GLOSSY RED SLAB
    ========================= */

    .gloss-panel {

      position: absolute;

      right: 7vw;
      top: 150px;

      width: min(340px, 29vw);
      height: 430px;

      background:
        radial-gradient(
          circle at 28% 17%,
          rgba(255,255,255,.95) 0 2%,
          rgba(255,255,255,.35) 3%,
          transparent 10%
        ),
        linear-gradient(
          145deg,
          var(--bright-red),
          var(--red) 45%,
          var(--deep-red) 100%
        );

      border: 2px solid var(--wine);

      box-shadow:
        16px 18px 0 rgba(76,6,18,.15),
        inset -20px -30px 50px rgba(44,0,7,.25);

      transform: rotate(4deg);

      z-index: -1;

      overflow: hidden;
    }

    .gloss-panel::before {
      content: "";

      position: absolute;

      width: 160%;
      height: 70px;

      top: 90px;
      left: -30%;

      background: rgba(255,255,255,.13);

      transform: rotate(-28deg);

      filter: blur(2px);
    }

    .gloss-panel::after {
      content: "";

      position: absolute;

      width: 110px;
      height: 110px;

      border-radius: 50%;

      bottom: 38px;
      right: 35px;

      background: rgba(255,255,255,.07);

      box-shadow:
        inset -15px -20px 30px rgba(40,0,8,.25);
    }


    /* =========================
       DIVA WORD
    ========================= */

    .diva {
      position: absolute;

      right: 7.7vw;
      top: 275px;

      width: min(320px, 26vw);

      text-align: center;

      color: var(--cream-light);

      font-family: "Bodoni Moda", serif;

      font-size: clamp(55px, 7vw, 100px);

      line-height: .8;

      font-weight: 700;

      font-style: italic;

      transform: rotate(4deg);

      text-shadow:
        0 4px 0 rgba(76,6,18,.35);

      z-index: 2;
    }

    .diva small {
      display: block;

      margin-top: 20px;

      font-family: "DM Sans", sans-serif;

      font-size: 9px;

      font-style: normal;

      text-transform: uppercase;

      letter-spacing: .35em;

      color: rgba(255,250,243,.9);
    }


    /* =========================
       LITTLE STATEMENT
    ========================= */

    .statement {

      max-width: 530px;

      margin-top: 50px;

      margin-left: 4px;

      font-size: 15px;

      line-height: 1.9;

      color: #684d53;
    }

    .statement strong {
      color: var(--wine);
    }


    /* =========================
       SPARKLES
    ========================= */

    .spark {
      position: absolute;

      color: var(--red);

      font-family: "Bodoni Moda", serif;

      font-size: 35px;

      z-index: 5;
    }

    .s1 {
      top: 120px;
      right: 41%;
    }

    .s2 {
      bottom: 125px;
      right: 8%;
      font-size: 25px;
    }

    .s3 {
      top: 46%;
      left: 4%;
      font-size: 22px;
    }


    /* =========================
       GIANT BOW
    ========================= */

    .bow {
      position: absolute;

      bottom: 32px;
      right: 7vw;

      width: 190px;
      height: 135px;

      z-index: 10;
    }

    .bow-left,
    .bow-right {

      position: absolute;

      top: 8px;

      width: 105px;
      height: 78px;

      background:
        linear-gradient(
          135deg,
          var(--bright-red),
          var(--red) 48%,
          var(--deep-red)
        );

      border: 2px solid var(--wine);

      box-shadow:
        inset -10px -12px 20px rgba(48,0,8,.25),
        6px 8px 0 rgba(76,6,18,.12);
    }

    .bow-left {
      left: 0;

      border-radius: 75% 25% 55% 30%;

      transform: rotate(17deg);
    }

    .bow-right {
      right: 0;

      border-radius: 25% 75% 30% 55%;

      transform: rotate(-17deg);
    }

    .bow-left::after,
    .bow-right::after {

      content: "";

      position: absolute;

      width: 70px;
      height: 12px;

      top: 13px;

      background: rgba(255,255,255,.16);

      border-radius: 50%;

      filter: blur(1px);
    }

    .bow-left::after {
      left: 10px;
      transform: rotate(-12deg);
    }

    .bow-right::after {
      right: 10px;
      transform: rotate(12deg);
    }

    .bow-knot {

      position: absolute;

      width: 48px;
      height: 48px;

      left: 71px;
      top: 28px;

      border-radius: 50%;

      background:
        radial-gradient(
          circle at 30% 25%,
          #ff6c7f,
          var(--bright-red) 30%,
          var(--deep-red)
        );

      border: 2px solid var(--wine);

      box-shadow:
        inset -7px -9px 15px rgba(35,0,5,.3);

      z-index: 3;
    }

    .tail {

      position: absolute;

      width: 53px;
      height: 70px;

      top: 65px;

      background: var(--red);

      border: 2px solid var(--wine);

      z-index: -1;
    }

    .tail.left {

      left: 42px;

      transform: rotate(17deg);

      clip-path: polygon(
        0 0,
        100% 8%,
        75% 100%,
        48% 76%,
        10% 100%
      );
    }

    .tail.right {

      right: 40px;

      transform: rotate(-17deg);

      clip-path: polygon(
        0 8%,
        100% 0,
        90% 100%,
        52% 76%,
        25% 100%
      );
    }


    /* =========================
       FOOTER
    ========================= */

    .footer {

      min-height: 86px;

      border-top: 2px solid var(--wine);

      padding: 17px 32px;

      display: flex;

      align-items: center;

      justify-content: space-between;
    }

    .footer-text {

      font-family: "Bodoni Moda", serif;

      font-size: 15px;

      font-style: italic;

      color: var(--muted);
    }

    .next {

      display: inline-flex;

      align-items: center;

      gap: 13px;

      padding: 14px 23px;

      background: var(--red);

      color: var(--cream-light);

      border: 2px solid var(--wine);

      box-shadow: 5px 5px 0 var(--wine);

      text-decoration: none;

      font-size: 10px;

      font-weight: 700;

      text-transform: uppercase;

      letter-spacing: .17em;

      transition: .2s ease;
    }

    .next:hover {

      background: var(--bright-red);

      transform: translate(3px, 3px);

      box-shadow: 2px 2px 0 var(--wine);
    }


    /* =========================
       MOBILE
    ========================= */

    @media (max-width: 850px) {

      .page {
        width: calc(100% - 18px);
        margin: 9px auto;
      }

      .top {
        height: 62px;
        padding: 0 20px;
      }

      .hero {
        min-height: 800px;
        padding: 50px 27px 230px;
      }

      h1 {
        font-size: clamp(67px, 19vw, 115px);
      }

      h1 .birthday {
        margin-left: 35px;
      }

      .gloss-panel {
        top: auto;
        bottom: 120px;
        right: 25px;

        width: 230px;
        height: 250px;

        opacity: .95;
      }

      .diva {
        top: auto;
        bottom: 195px;
        right: 35px;

        width: 210px;

        font-size: 60px;
      }

      .bow {
        bottom: 55px;
        right: 20px;

        transform: scale(.75);
        transform-origin: bottom right;
      }

      .statement {
        max-width: 90%;
        margin-top: 40px;
      }

      .number {
        font-size: 300px;
        right: -60px;
      }

      .footer {
        padding: 17px 20px;
      }

      .footer-text {
        display: none;
      }

      .footer {
        justify-content: flex-end;
      }
    }


    @media (max-width: 480px) {

      .hero {
        min-height: 760px;
      }

      .label {
        font-size: 9px;
      }

      h1 {
        font-size: 65px;
      }

      h1 .birthday {
        margin-left: 25px;
      }

      .statement {
        font-size: 13px;
      }

      .gloss-panel {
        width: 190px;
        height: 220px;
        right: 20px;
        bottom: 110px;
      }

      .diva {
        font-size: 50px;
        width: 180px;
        right: 25px;
        bottom: 170px;
      }

      .bow {
        transform: scale(.6);
      }

      .s1 {
        right: 15%;
      }
    }

  </style>
</head>

<body>

  <div class="page">

    <header class="top">
      <span>04 / 10 / 2026</span>
      <span class="right-text">THE ROSE EDITION</span>
    </header>


    <main class="hero">

      <div class="number">04</div>

      <span class="spark s1">✦</span>
      <span class="spark s2">✦</span>
      <span class="spark s3">✧</span>


      <div class="label">
        the birthday girl
      </div>


      <h1>
        <span class="happy">Happy</span>
        <span class="birthday">Birthday.</span>
      </h1>


      <p class="statement">
        To the girl who can somehow turn an ordinary moment
        into a whole <strong>event.</strong>
        <br><br>
        Today, there is only one rule:
        <strong>the world revolves around Rose.</strong>
      </p>


      <div class="gloss-panel"></div>


      <div class="diva">
        Rose
        <small>the main character · always</small>
      </div>


      <div class="bow">

        <div class="tail left"></div>
        <div class="tail right"></div>

        <div class="bow-left"></div>
        <div class="bow-right"></div>

        <div class="bow-knot"></div>

      </div>

    </main>


    <footer class="footer">

      <div class="footer-text">
        born to be unforgettable.
      </div>

      <a href="three.html" class="next">
        enter our story
        <span>→</span>
      </a>

    </footer>

  </div>

</body>
</html>
